[build]
builder = "nixpacks"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "app"

[services.variables]
PORT = "5000"

[services.build]
buildCommand = "pip install -r requirements.txt"
startCommand = "python app_railway.py"

[services.build.env]
PYTHON_VERSION = "3.9"

[env]
PORT = "5000"
OLLAMA_HOST = "0.0.0.0"
OLLAMA_PORT = "11434"
